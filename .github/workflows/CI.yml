name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch or PR cancels the run that is still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.configuration }})
    runs-on: windows-2025-vs2026

    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Local actions are read from the checked out repository, so this step must come after the checkout.
      - name: Set up vcpkg
        uses: ./.github/actions/SetUpVcpkg
        with:
          configuration: ${{ matrix.configuration }}

      - name: Configure
        run: cmake --preset windows-msvc

      - name: Build
        run: cmake --build --preset ${{ matrix.configuration }}

      - name: Test
        run: ctest --preset ${{ matrix.configuration }}
